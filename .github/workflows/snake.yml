name: Generate Profile Assets

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=lickoc&show_icons=true&theme=radical&bg_color=0d1117&hide_border=true&title_color=6e40c9&icon_color=1f6feb&text_color=c9d1d9
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top langs card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=lickoc&layout=compact&theme=radical&bg_color=0d1117&hide_border=true&title_color=6e40c9&text_color=c9d1d9&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Snake (dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: lickoc
          outputs: profile/github-snake-dark.svg
          svg_out_dark: profile/github-snake-dark.svg

      - name: Generate Snake (light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: lickoc
          outputs: profile/github-snake.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update profile assets" || exit 0
          git push
